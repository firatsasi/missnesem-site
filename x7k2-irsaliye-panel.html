<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Miss Neşem · İrsaliye</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#e8ddc9;padding:1rem;color:#2c2419}
.wrap{max-width:680px;margin:0 auto;font-size:12px}
.card{background:#f0e4d3;border-radius:10px;border:1px solid #b8985e;padding:1.5rem}
.brand{text-align:center;margin-bottom:1.2rem}
.bn{font-size:20px;font-weight:700;letter-spacing:5px;color:#2c2419}
.bc{font-size:9px;letter-spacing:3px;color:#a64d3e;margin-top:3px}
.bl{width:60px;height:1px;background:#b8985e;margin:8px auto}
.bd{font-size:11px;font-weight:700;letter-spacing:4px;color:#2c2419}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.2rem}
.flbl{font-size:9px;letter-spacing:1.5px;color:#a64d3e;font-weight:700;display:block;margin-bottom:3px}
input.finp,input.ri{background-color:#ffffff !important;color:#2c2419 !important;-webkit-text-fill-color:#2c2419 !important;border:1px solid #c8a87a;border-radius:6px;font-family:Arial,sans-serif}
input.finp{width:100%;font-size:14px;padding:8px 9px}
input.finp:focus,input.ri:focus{outline:1.5px solid #a64d3e;border-color:#a64d3e}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;min-width:520px}
thead{background:#2c2419}
th{padding:7px 8px;font-size:9px;font-weight:700;letter-spacing:1px;color:#f0e4d3;text-align:left;white-space:nowrap}
th.r{text-align:right}
tbody tr:nth-child(odd){background:#fff}
tbody tr:nth-child(even){background:#faf6f0}
tbody td{border-bottom:1px solid #e0cdb5;padding:4px 5px;vertical-align:middle}
input.ri{width:100%;font-size:14px;padding:7px;display:block}
input.ri::placeholder{color:#c0a070;font-size:11px}
.fiyat-wrap{display:flex;align-items:center;gap:3px;background:#fff;border:1px solid #c8a87a;border-radius:6px;padding:0 6px}
.fiyat-wrap input{border:none !important;outline:none !important;background:transparent !important;padding:7px 0;text-align:right;width:100%;font-size:14px;color:#2c2419 !important;-webkit-text-fill-color:#2c2419 !important;min-width:0}
.fiyat-sym{font-size:11px;color:#a64d3e;font-weight:700;white-space:nowrap}
.td-top{padding:5px 6px;text-align:right;color:#2c2419;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-del{text-align:center}
.td-del button{background:none;border:none;cursor:pointer;color:#a64d3e;font-size:18px;padding:2px 6px}
.opts{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;align-items:center}
.opt-grp{display:flex;align-items:center;gap:6px}
.opt-lbl{font-size:9px;letter-spacing:1px;color:#a64d3e;font-weight:700;white-space:nowrap}
select.opt-sel{background-color:#fff !important;color:#2c2419 !important;border:1px solid #c8a87a;border-radius:6px;padding:5px 7px;font-size:12px;cursor:pointer;font-family:Arial,sans-serif;height:30px}
.add-btn{margin-top:8px;font-size:12px;padding:7px 14px;cursor:pointer;color:#2c2419;border:1px solid #b8985e;border-radius:6px;background:rgba(184,152,94,0.2);font-weight:600}
.totals{margin-top:1.2rem;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ara-row{display:flex;gap:12px;align-items:center;padding:3px 0;font-size:12px}
.ara-lbl{color:#a64d3e;font-size:10px;letter-spacing:1px;font-weight:700;min-width:90px;text-align:right}
.ara-val{color:#2c2419;font-weight:600;min-width:90px;text-align:right}
.total-box{background:#2c2419;border-radius:7px;padding:11px 18px;display:flex;align-items:center;gap:16px;margin-top:4px}
.total-lbl{font-size:9px;letter-spacing:2px;color:#b8985e}
.total-val{font-size:18px;font-weight:700;color:#f0e4d3}
.btns{margin-top:1.2rem;padding-top:1.2rem;border-top:1px solid #b8985e;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn-sec{font-size:12px;padding:8px 14px;cursor:pointer;color:#2c2419;border:1px solid #b8985e;border-radius:6px;background:transparent;font-weight:600}
.btn-pri{font-size:12px;padding:8px 16px;cursor:pointer;color:#f0e4d3;border:none;border-radius:6px;background:#a64d3e;font-weight:700}
@media print{
  body{background:#fff;padding:0}
  .add-btn,.btns,.opts,.td-del,.td-del button{display:none !important}
  .card{border:none}
  thead{background:#2c2419 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .total-box{background:#2c2419 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{background:#f0e4d3 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:480px){
  .fields{grid-template-columns:1fr}
  .bn{font-size:18px;letter-spacing:3px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <div class="brand">
    <div class="bn">MISS NEŞEM</div>
    <div class="bc">MERTER · İSTANBUL</div>
    <div class="bl"></div>
    <div class="bd">İRSALİYE</div>
  </div>

  <div class="fields">
    <div>
      <label class="flbl">MÜŞTERİ</label>
      <input class="finp" type="text" id="musteri" placeholder="Müşteri adı" />
    </div>
    <div>
      <label class="flbl">TARİH</label>
      <input class="finp" type="date" id="tarih" />
    </div>
  </div>

  <div class="table-scroll">
  <table>
    <colgroup>
      <col style="width:90px">
      <col>
      <col style="width:120px">
      <col style="width:100px">
      <col style="width:34px">
    </colgroup>
    <thead>
      <tr>
        <th>ADET</th>
        <th>ÜRÜN / KOD / RENK</th>
        <th class="r">BİRİM FİYAT</th>
        <th class="r">TOPLAM</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>
  </div>

  <button class="add-btn" onclick="ekle()">+ Satır ekle</button>

  <div class="opts">
    <div class="opt-grp">
      <span class="opt-lbl">PARA</span>
      <select class="opt-sel" id="para" onchange="hesapla()">
        <option value="TL">₺ TL</option>
        <option value="USD">$ USD</option>
        <option value="EUR">€ EUR</option>
      </select>
    </div>
    <div class="opt-grp">
      <span class="opt-lbl">KDV</span>
      <select class="opt-sel" id="kdvOran" onchange="hesapla()">
        <option value="0">Yok</option>
        <option value="5">%5</option>
        <option value="10">%10</option>
      </select>
    </div>
  </div>

  <div class="totals">
    <div class="ara-row" id="araRow" style="display:none">
      <span class="ara-lbl">ARA TOPLAM</span>
      <span class="ara-val" id="araToplam">-</span>
    </div>
    <div class="ara-row" id="kdvRow" style="display:none">
      <span class="ara-lbl" id="kdvLbl">KDV</span>
      <span class="ara-val" id="kdvTutar">-</span>
    </div>
    <div class="total-box">
      <span class="total-lbl">GENEL TOPLAM</span>
      <span class="total-val" id="gt">0 ₺</span>
    </div>
  </div>

  <div class="btns">
    <button class="btn-sec" onclick="temizle()">Temizle</button>
    <button class="btn-pri" onclick="window.print()">Yazdır / PDF</button>
  </div>
</div>
</div>

<script>
var sc=0;
var sym={TL:'₺',USD:'$',EUR:'€'};
function birim(){return sym[document.getElementById('para').value]||'₺';}
function fmt(n){
  var p=document.getElementById('para').value;
  if(p==='TL') return n.toLocaleString('tr-TR')+' ₺';
  return sym[p]+' '+n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function ekle(){
  sc++;
  var tbody=document.getElementById('tb');
  var tr=document.createElement('tr');

  var td1=document.createElement('td');
  var i1=document.createElement('input');
  i1.type='text'; i1.inputMode='numeric'; i1.placeholder='6'; i1.className='ri';
  i1.style.textAlign='center';
  i1.addEventListener('input',function(){i1.value=i1.value.replace(/[^0-9]/g,'');hesapla();});
  td1.appendChild(i1);

  var td2=document.createElement('td');
  var i2=document.createElement('input');
  i2.type='text'; i2.placeholder='Ürün adı / kod / renk'; i2.className='ri';
  td2.appendChild(i2);

  var td3=document.createElement('td');
  var fw=document.createElement('div'); fw.className='fiyat-wrap';
  var sspan=document.createElement('span'); sspan.className='fiyat-sym'; sspan.textContent=birim(); fw.appendChild(sspan);
  var i3=document.createElement('input');
  i3.type='text'; i3.inputMode='decimal'; i3.placeholder='0';
  i3.addEventListener('input',function(){i3.value=i3.value.replace(/[^0-9.,]/g,'');hesapla();});
  fw.appendChild(i3);
  td3.appendChild(fw);

  var td4=document.createElement('td');
  td4.className='td-top'; td4.textContent='-';

  var td5=document.createElement('td');
  td5.className='td-del';
  var btn=document.createElement('button');
  btn.textContent='×';
  btn.onclick=function(){tr.remove();hesapla();};
  td5.appendChild(btn);

  tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);tr.appendChild(td4);tr.appendChild(td5);
  tbody.appendChild(tr);
  hesapla();
}
function hesapla(){
  document.querySelectorAll('.fiyat-sym').forEach(function(s){s.textContent=birim();});
  var ara=0;
  document.querySelectorAll('#tb tr').forEach(function(tr){
    var qty=tr.querySelector('td:nth-child(1) input');
    var prc=tr.querySelector('.fiyat-wrap input');
    var a=parseFloat(qty.value)||0;
    var f=parseFloat((prc.value||'').replace(',','.'))||0;
    var t=a*f;
    var h=tr.querySelector('.td-top');
    if(h) h.textContent=t>0?fmt(t):'-';
    ara+=t;
  });
  var oran=parseInt(document.getElementById('kdvOran').value)||0;
  var kdv=Math.round(ara*oran/100*100)/100;
  var genel=ara+kdv;
  if(oran>0){
    document.getElementById('araRow').style.display='flex';
    document.getElementById('kdvRow').style.display='flex';
    document.getElementById('araToplam').textContent=fmt(ara);
    document.getElementById('kdvLbl').textContent='KDV (%'+oran+')';
    document.getElementById('kdvTutar').textContent=fmt(kdv);
  } else {
    document.getElementById('araRow').style.display='none';
    document.getElementById('kdvRow').style.display='none';
  }
  document.getElementById('gt').textContent=fmt(genel);
}
function temizle(){
  document.getElementById('tb').innerHTML='';
  document.getElementById('musteri').value='';
  document.getElementById('tarih').value='';
  document.getElementById('kdvOran').value='0';
  document.getElementById('para').value='TL';
  document.getElementById('araRow').style.display='none';
  document.getElementById('kdvRow').style.display='none';
  document.getElementById('gt').textContent='0 ₺';
  sc=0;
}
ekle();ekle();ekle();
</script>
</body>
</html>
