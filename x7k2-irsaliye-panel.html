<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Miss Neşem · İrsaliye</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#e8ddc9;padding:1rem;color:#2c2419}
.wrap{max-width:760px;margin:0 auto;font-size:13px}
.card{background:#f0e4d3;border-radius:10px;border:1px solid #b8985e;padding:2rem}
.brand{text-align:center;margin-bottom:1.5rem}
.bn{font-size:24px;font-weight:700;letter-spacing:6px;color:#2c2419}
.bc{font-size:10px;letter-spacing:3px;color:#a64d3e;margin-top:4px}
.bl{width:70px;height:1px;background:#b8985e;margin:10px auto}
.bd{font-size:13px;font-weight:700;letter-spacing:5px;color:#2c2419}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
.flbl{font-size:10px;letter-spacing:1.5px;color:#a64d3e;font-weight:700;display:block;margin-bottom:4px}
.cell{background:#fff !important;color:#2c2419 !important;-webkit-text-fill-color:#2c2419 !important;border:1px solid #c8a87a;border-radius:6px;font-family:Arial,sans-serif}
input.finp{width:100%;font-size:15px;padding:9px 10px}
input.finp:focus,input.ri:focus{outline:1.5px solid #a64d3e;border-color:#a64d3e}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;min-width:560px}
thead{background:#2c2419}
th{padding:9px 10px;font-size:10px;font-weight:700;letter-spacing:1px;color:#f0e4d3;text-align:left;white-space:nowrap}
th.r{text-align:right}
tbody tr:nth-child(odd){background:#fff}
tbody tr:nth-child(even){background:#faf6f0}
tbody td{border-bottom:1px solid #e0cdb5;padding:6px;vertical-align:middle}
input.ri{width:100%;font-size:15px;padding:9px}
input.ri::placeholder{color:#c0a070;font-size:12px}
.fiyat-wrap{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid #c8a87a;border-radius:6px;padding:0 8px}
.fiyat-wrap input{border:none !important;outline:none !important;background:transparent !important;padding:9px 0;text-align:right;width:100%;font-size:15px;color:#2c2419 !important;-webkit-text-fill-color:#2c2419 !important;min-width:0}
.fiyat-sym{font-size:13px;color:#a64d3e;font-weight:700;white-space:nowrap}
.td-top{padding:9px 10px;text-align:right;color:#2c2419;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-del{text-align:center}
.td-del button{background:none;border:none;cursor:pointer;color:#a64d3e;font-size:20px;padding:2px 6px}
.opts{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;align-items:center}
.opt-grp{display:flex;align-items:center;gap:6px}
.opt-lbl{font-size:10px;letter-spacing:1px;color:#a64d3e;font-weight:700;white-space:nowrap}
select.opt-sel{background-color:#fff !important;color:#2c2419 !important;border:1px solid #c8a87a;border-radius:6px;padding:6px 8px;font-size:13px;cursor:pointer;font-family:Arial,sans-serif;height:32px}
.add-btn{margin-top:10px;font-size:13px;padding:8px 16px;cursor:pointer;color:#2c2419;border:1px solid #b8985e;border-radius:6px;background:rgba(184,152,94,0.2);font-weight:600}
.totals{margin-top:1.5rem;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ara-row{display:flex;gap:14px;align-items:center;padding:4px 0;font-size:14px}
.ara-lbl{color:#a64d3e;font-size:11px;letter-spacing:1px;font-weight:700;min-width:100px;text-align:right}
.ara-val{color:#2c2419;font-weight:700;min-width:100px;text-align:right}
.total-box{background:#2c2419;border-radius:8px;padding:13px 22px;display:flex;align-items:center;gap:20px;margin-top:6px}
.total-lbl{font-size:10px;letter-spacing:2px;color:#b8985e}
.total-val{font-size:20px;font-weight:700;color:#f0e4d3}
.foot-note{margin-top:1.5rem;text-align:center;font-size:10px;color:#a64d3e;letter-spacing:1px}
.btns{margin-top:1.2rem;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn-sec{font-size:13px;padding:10px 18px;cursor:pointer;color:#2c2419;border:1px solid #b8985e;border-radius:6px;background:transparent;font-weight:600}
.btn-pri{font-size:13px;padding:10px 20px;cursor:pointer;color:#f0e4d3;border:none;border-radius:6px;background:#a64d3e;font-weight:700}
@media(max-width:480px){.fields{grid-template-columns:1fr}.bn{font-size:20px;letter-spacing:3px}}

/* LOGIN EKRANI */
#loginOverlay{position:fixed;inset:0;background:#e8ddc9;display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem}
.login-box{background:#f0e4d3;border:1px solid #b8985e;border-radius:12px;padding:2.5rem 2rem;max-width:380px;width:100%;text-align:center;box-shadow:0 4px 20px rgba(44,36,25,0.1)}
.login-box .bn{font-size:22px;letter-spacing:5px;margin-bottom:4px}
.login-box .bc{font-size:10px;letter-spacing:3px;color:#a64d3e;margin-bottom:1.5rem}
.login-box h2{font-size:11px;letter-spacing:3px;color:#2c2419;margin-bottom:1.5rem;font-weight:700}
.login-box input{width:100%;padding:10px 12px;margin-bottom:10px;font-size:14px;border:1px solid #c8a87a;border-radius:6px;background:#fff;color:#2c2419;font-family:Arial,sans-serif}
.login-box input:focus{outline:1.5px solid #a64d3e;border-color:#a64d3e}
.login-box button{width:100%;padding:11px;font-size:13px;font-weight:700;color:#f0e4d3;background:#a64d3e;border:none;border-radius:6px;cursor:pointer;letter-spacing:2px;margin-top:6px}
.login-box .err{color:#a64d3e;font-size:11px;margin-top:8px;min-height:14px;font-weight:600}
#app{display:none}
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <div class="bn">MISS NEŞEM</div>
    <div class="bc">MERTER · İSTANBUL</div>
    <h2>YETKİLİ GİRİŞİ</h2>
    <input type="text" id="user" placeholder="Kullanıcı adı" autocomplete="username" />
    <input type="password" id="pass" placeholder="Şifre" autocomplete="current-password" />
    <button onclick="login()">GİRİŞ</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app">
<div class="wrap">
<div class="card" id="irsaliye">
  <div class="brand">
    <div class="bn">MISS NEŞEM</div>
    <div class="bc">MERTER · İSTANBUL</div>
    <div class="bl"></div>
    <div class="bd">İRSALİYE</div>
  </div>
  <div class="fields">
    <div><label class="flbl">MÜŞTERİ</label><input class="finp cell" type="text" id="musteri" placeholder="Müşteri adı" /></div>
    <div><label class="flbl">TARİH</label><input class="finp cell" type="date" id="tarih" /></div>
  </div>
  <div class="table-scroll">
  <table>
    <colgroup><col style="width:95px"><col><col style="width:135px"><col style="width:115px"><col style="width:36px" class="del-col"></colgroup>
    <thead><tr><th>ADET</th><th>ÜRÜN / KOD / RENK</th><th class="r">BİRİM FİYAT</th><th class="r">TOPLAM</th><th class="del-col"></th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  </div>
  <button class="add-btn" id="addBtn" onclick="ekle()">+ Satır ekle</button>
  <div class="opts" id="optsRow">
    <div class="opt-grp"><span class="opt-lbl">PARA</span><select class="opt-sel" id="para" onchange="hesapla()"><option value="TL">₺ TL</option><option value="USD">$ USD</option><option value="EUR">€ EUR</option></select></div>
    <div class="opt-grp"><span class="opt-lbl">KDV</span><select class="opt-sel" id="kdvOran" onchange="hesapla()"><option value="0">Yok</option><option value="5">%5</option><option value="10">%10</option></select></div>
  </div>
  <div class="totals">
    <div class="ara-row" id="araRow" style="display:none"><span class="ara-lbl">ARA TOPLAM</span><span class="ara-val" id="araToplam">-</span></div>
    <div class="ara-row" id="kdvRow" style="display:none"><span class="ara-lbl" id="kdvLbl">KDV</span><span class="ara-val" id="kdvTutar">-</span></div>
    <div class="total-box"><span class="total-lbl">GENEL TOPLAM</span><span class="total-val" id="gt">0 ₺</span></div>
  </div>
  <div class="foot-note">MISS NEŞEM · MERTER · İSTANBUL</div>
</div>
<div class="btns">
  <button class="btn-sec" onclick="temizle()">Temizle</button>
  <button class="btn-pri" onclick="pdfIndir()">PDF olarak indir</button>
</div>
</div>
</div>

<script>
/* ====== LOGIN ====== */
var KIMLIK="YWRtaW46MjEyNDQwMDEyelg=";
function login(){
  var u=document.getElementById('user').value.trim();
  var p=document.getElementById('pass').value;
  var k=btoa(u+':'+p);
  if(k===KIMLIK){
    var bitis=new Date();bitis.setDate(bitis.getDate()+30);
    document.cookie="mn_auth="+k+"; expires="+bitis.toUTCString()+"; path=/; SameSite=Strict";
    goster();
  }else{
    document.getElementById('err').textContent="Hatalı kullanıcı adı veya şifre";
  }
}
function goster(){
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('app').style.display='block';
}
function check(){
  var c=document.cookie.split(';').find(function(x){return x.trim().indexOf('mn_auth=')===0;});
  if(c&&c.split('=')[1]===KIMLIK){goster();}
}
document.getElementById('pass').addEventListener('keypress',function(e){if(e.key==='Enter')login();});
document.getElementById('user').addEventListener('keypress',function(e){if(e.key==='Enter')document.getElementById('pass').focus();});
check();

/* ====== İRSALİYE ====== */
var sc=0;
var sym={TL:'₺',USD:'$',EUR:'€'};
function birim(){return sym[document.getElementById('para').value]||'₺';}
function fmt(n){var p=document.getElementById('para').value;if(p==='TL')return n.toLocaleString('tr-TR')+' ₺';return sym[p]+' '+n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ekle(){
  sc++;
  var tbody=document.getElementById('tb');
  var tr=document.createElement('tr');
  var td1=document.createElement('td');
  var i1=document.createElement('input');
  i1.type='text';i1.inputMode='numeric';i1.placeholder='6';i1.className='ri cell';i1.style.textAlign='center';
  i1.addEventListener('input',function(){i1.value=i1.value.replace(/[^0-9]/g,'');hesapla();});
  td1.appendChild(i1);
  var td2=document.createElement('td');
  var i2=document.createElement('input');
  i2.type='text';i2.placeholder='Ürün adı / kod / renk';i2.className='ri cell';
  td2.appendChild(i2);
  var td3=document.createElement('td');
  var fw=document.createElement('div');fw.className='fiyat-wrap';
  var sspan=document.createElement('span');sspan.className='fiyat-sym';sspan.textContent=birim();fw.appendChild(sspan);
  var i3=document.createElement('input');
  i3.type='text';i3.inputMode='decimal';i3.placeholder='0';
  i3.addEventListener('input',function(){i3.value=i3.value.replace(/[^0-9.,]/g,'');hesapla();});
  fw.appendChild(i3);td3.appendChild(fw);
  var td4=document.createElement('td');td4.className='td-top';td4.textContent='-';
  var td5=document.createElement('td');td5.className='td-del';
  var btn=document.createElement('button');btn.textContent='×';
  btn.onclick=function(){tr.remove();hesapla();};
  td5.appendChild(btn);
  tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);tr.appendChild(td4);tr.appendChild(td5);
  tbody.appendChild(tr);hesapla();
}
function hesapla(){
  document.querySelectorAll('.fiyat-sym').forEach(function(s){s.textContent=birim();});
  var ara=0;
  document.querySelectorAll('#tb tr').forEach(function(tr){
    var qty=tr.querySelector('td:nth-child(1) input');
    var prc=tr.querySelector('.fiyat-wrap input');
    var a=parseFloat(qty.value)||0;
    var f=parseFloat((prc.value||'').replace(',','.'))||0;
    var t=a*f;
    var h=tr.querySelector('.td-top');
    if(h)h.textContent=t>0?fmt(t):'-';
    ara+=t;
  });
  var oran=parseInt(document.getElementById('kdvOran').value)||0;
  var kdv=Math.round(ara*oran/100*100)/100;
  var genel=ara+kdv;
  if(oran>0){
    document.getElementById('araRow').style.display='flex';
    document.getElementById('kdvRow').style.display='flex';
    document.getElementById('araToplam').textContent=fmt(ara);
    document.getElementById('kdvLbl').textContent='KDV (%'+oran+')';
    document.getElementById('kdvTutar').textContent=fmt(kdv);
  }else{
    document.getElementById('araRow').style.display='none';
    document.getElementById('kdvRow').style.display='none';
  }
  document.getElementById('gt').textContent=fmt(genel);
}
function temizle(){
  document.getElementById('tb').innerHTML='';
  document.getElementById('musteri').value='';
  document.getElementById('tarih').value='';
  document.getElementById('kdvOran').value='0';
  document.getElementById('para').value='TL';
  document.getElementById('araRow').style.display='none';
  document.getElementById('kdvRow').style.display='none';
  document.getElementById('gt').textContent='0 ₺';
  sc=0;ekle();ekle();ekle();
}
function inputlariMetneCevir(){
  var saved=[];
  document.querySelectorAll('#irsaliye input').forEach(function(inp){
    var span=document.createElement('span');
    span.className='pdf-temp';
    var txt=inp.value||'';
    if(inp.id==='tarih'&&inp.value){var d=inp.value.split('-');txt=d[2]+'.'+d[1]+'.'+d[0];}
    span.textContent=txt;
    var inFiyat=inp.closest('.fiyat-wrap');
    if(inFiyat){
      span.style.cssText='font-size:15px;color:#2c2419;text-align:right;flex:1;padding:9px 0';
    }else{
      span.style.cssText='display:block;width:100%;font-size:15px;padding:9px 10px;background:#fff;border:1px solid #c8a87a;border-radius:6px;color:#2c2419;min-height:38px';
      if(inp.style.textAlign==='center')span.style.textAlign='center';
    }
    inp.style.display='none';
    inp.parentNode.insertBefore(span,inp.nextSibling);
    saved.push(inp);
  });
  return saved;
}
function inputlariGeriYukle(saved){
  document.querySelectorAll('.pdf-temp').forEach(function(s){s.remove();});
  saved.forEach(function(inp){inp.style.display='';});
}
function pdfIndir(){
  var addBtn=document.getElementById('addBtn');
  var optsRow=document.getElementById('optsRow');
  var delCells=document.querySelectorAll('.td-del');
  var delCols=document.querySelectorAll('.del-col');
  addBtn.style.display='none';
  optsRow.style.display='none';
  delCells.forEach(function(c){c.style.display='none';});
  delCols.forEach(function(c){c.style.display='none';});
  var saved=inputlariMetneCevir();
  var musteri=document.getElementById('musteri').value||'irsaliye';
  var dosyaAdi='MissNesem_'+musteri.replace(/[^a-zA-Z0-9ğüşıöçĞÜŞİÖÇ ]/g,'').trim().replace(/\s+/g,'_')+'.pdf';
  var el=document.getElementById('irsaliye');
  var opt={margin:[8,8,8,8],filename:dosyaAdi,image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,backgroundColor:'#f0e4d3'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}};
  html2pdf().set(opt).from(el).save().then(function(){
    addBtn.style.display='';
    optsRow.style.display='flex';
    delCells.forEach(function(c){c.style.display='';});
    delCols.forEach(function(c){c.style.display='';});
    inputlariGeriYukle(saved);
  });
}
ekle();ekle();ekle();
</script>
</body>
</html>
